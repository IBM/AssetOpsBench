<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transformer</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#233b31;background:#f5f8f5;font-synthesis:none;font-size:13px}*{box-sizing:border-box}body{margin:0}main{max-width:1540px;padding:28px;margin:auto}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #e2e9e3;border-radius:16px;padding:22px;min-width:0}.model{display:flex;flex-direction:column;gap:18px}.name{font-size:14px;font-weight:550}.number{font-size:34px;font-weight:500;letter-spacing:-1.5px}.muted{color:#829087;font-size:11px}.stats{display:flex;justify-content:space-between;gap:8px;font-size:12px}progress{width:100%;height:4px;border:0;appearance:none;display:block}progress::-webkit-progress-bar{background:#edf2ed;border-radius:5px}progress::-webkit-progress-value{background:#608774;border-radius:5px}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin:14px 0}.title{font-weight:550;margin:0 0 22px;font-size:14px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;text-align:right;white-space:nowrap}th{color:#829087;font-weight:450;font-size:11px}td,th{padding:12px 8px;border-bottom:1px solid #edf1ed}td:first-child,th:first-child{text-align:left;padding-left:0}td:last-child,th:last-child{padding-right:0}tr:last-child td{border-bottom:0}.filters{display:flex;align-items:center;gap:10px;margin-bottom:16px}.filters .title{margin:0 auto 0 0}input,select,button{font:inherit;color:inherit;background:#fff;border:1px solid #e2e9e3;border-radius:8px;padding:8px 10px;outline:none}input{width:230px}input:focus{border-color:#93aa9b}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}.scenario{border-top:1px solid #edf1ed;padding:17px 0}.scenario:last-child{padding-bottom:0}.scenario summary{display:grid;grid-template-columns:30px 1fr 130px;gap:12px;align-items:center}.index{color:#9ca79f;font-size:11px}.question{line-height:1.65;font-size:12px}.dots{display:flex;justify-content:flex-end;gap:13px}.dot{height:8px;width:8px;border-radius:50%;background:#e4eae5}.dot.pass{background:#5e9377}.dot.fail,.dot.failed,.dot.timed_out{background:#c68b7c}.dot.running,.dot.grading{background:#bea974;animation:pulse 2s infinite}.dot.executed{background:#92a99a}.detail{margin:18px 0 0 42px}.answer{white-space:pre-wrap;line-height:1.7;font-size:12px;margin-top:16px;max-height:420px;overflow:auto}.modelresult{border:1px solid #e2e9e3;border-radius:12px;margin:10px 0;padding:18px}.resulthead{display:flex;justify-content:space-between;align-items:center}.pill{font-size:10px;padding:4px 7px;border-radius:5px;background:#f3f6f3;color:#7b8980}.pill.pass{color:#52876b}.pill.fail,.pill.failed,.pill.timed_out{color:#b37263}.inline{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:#829087;margin-top:12px}.rationale{color:#6e7f74;font-size:12px;line-height:1.65;border-top:1px solid #edf1ed;padding-top:15px;margin-top:15px}pre{font-size:11px;line-height:1.6;white-space:pre-wrap;overflow:auto;max-height:420px;background:#f8faf8;padding:12px;border-radius:8px}.trace summary{font-size:11px;color:#829087;margin-top:14px}.legend{display:flex;justify-content:flex-end;gap:18px;color:#829087;font-size:10px;margin-bottom:10px}.legend span{display:flex;align-items:center;gap:5px}@keyframes pulse{50%{opacity:.4}}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.filters{flex-wrap:wrap}}@media(max-width:650px){main{padding:14px}.cards{grid-template-columns:repeat(2,1fr)}.card{padding:16px}.scenario summary{grid-template-columns:20px 1fr}.dots{grid-column:2;justify-content:flex-start}.detail{margin-left:0}.filters input{width:100%}.legend{flex-wrap:wrap;justify-content:flex-start}}
.resultcard{min-height:0;overflow:hidden}.result-list{height:min(660px,70vh);max-height:660px;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}@media(max-width:650px){.result-list{height:65vh;max-height:600px}}#scenarios{max-height:600px;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding-right:12px}@media(max-width:650px){#scenarios{max-height:65vh}}.scenario{padding:20px 0}.scenario summary{grid-template-columns:28px minmax(0,1fr) 130px 16px;gap:18px;align-items:center}.scenario .question{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.65}.scenario[open] .question{display:block;-webkit-line-clamp:unset}.scenario-chevron{width:7px;height:7px;border-right:1.5px solid #8fa493;border-bottom:1.5px solid #8fa493;transform:rotate(45deg);justify-self:center;align-self:center;margin-top:-3px;transition:transform .15s}.scenario[open] .scenario-chevron{transform:rotate(225deg);margin-top:3px}.scenario .dots{display:grid;grid-template-columns:repeat(5,1fr);justify-items:center;gap:0}.legend{padding-right:34px}.scenario .detail{margin:20px 34px 0 46px}.scenario .index{align-self:center}@media(max-width:650px){.scenario summary{grid-template-columns:20px minmax(0,1fr) 14px;gap:12px}.scenario .question{grid-column:2}.scenario .scenario-chevron{grid-column:3;grid-row:1}.scenario .dots{grid-column:2;grid-row:2;display:flex;gap:14px;justify-content:flex-start}.scenario .detail{margin:18px 0 0 32px}.legend{padding-right:0}}.chart{width:100%;height:auto;display:block}.chart text{font-family:inherit;font-size:11px;fill:#829087}.chart .label{fill:#233b31}.chart-key{display:flex;gap:18px;flex-wrap:wrap;margin:-6px 0 18px;font-size:11px;color:#829087}.chart-key span{display:flex;align-items:center;gap:6px}.swatch{width:7px;height:7px;border-radius:50%;display:inline-block}.charts{grid-template-columns:1fr 1fr}.heat td:not(:first-child){border:4px solid white;border-radius:8px;text-align:center;font-variant-numeric:tabular-nums}.heat th:not(:first-child){text-align:center}.heat td:first-child{min-width:120px}.metrics-table{margin:14px 0}.metrics-table td{font-variant-numeric:tabular-nums}.model .stats{font-size:11px}.outcomes{height:5px;background:#edf2ed;border-radius:5px;display:flex;overflow:hidden}.outcomes span{height:100%}.model-footer{display:flex;justify-content:space-between;font-size:11px}.model-footer .failed{color:#b37263}.chart-heading{display:flex;align-items:center;justify-content:space-between;gap:15px}.chart-heading .muted{white-space:nowrap}.grid{grid-template-columns:1fr 1fr}@media(max-width:1100px){.grid{grid-template-columns:1fr}}#scenarios{--model-count:5;--model-width:390px}.scenario summary,.scenario-columns{display:grid;grid-template-columns:28px minmax(180px,1fr) var(--model-width) 16px;gap:18px;min-width:700px;align-items:center}.scenario-columns{position:sticky;top:0;z-index:2;background:white;padding:12px 0 16px;border-bottom:1px solid #edf1ed}.model-columns,.scenario .dots{display:grid;grid-template-columns:repeat(var(--model-count),minmax(0,1fr));gap:0;justify-items:center}.model-columns{color:#829087;font-size:10px;text-align:center}.model-columns span{width:100%}.scenario .dots{grid-column:3;grid-row:1}.scenario .question{grid-column:2;grid-row:1}.scenario .scenario-chevron{grid-column:4;grid-row:1}.scenario:first-of-type{border-top:0}@media(max-width:650px){#scenarios{--model-width:330px}.scenario summary,.scenario-columns{gap:12px;grid-template-columns:20px minmax(180px,1fr) var(--model-width) 14px}.scenario .dots{display:grid;justify-content:normal;gap:0}}.model{gap:20px}.card-score{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.card-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;color:#829087;font-size:10px}.card-counts span{display:flex;flex-direction:column;gap:5px}.card-counts b{font-size:16px;font-weight:500;color:#233b31}.card-counts span:nth-child(2) b{color:#b37263}.card-score .muted{font-size:10px}.picker{position:relative;flex:none}.picker-trigger{display:flex;align-items:center;justify-content:space-between;gap:18px;min-width:110px;cursor:pointer;padding:10px 13px}.picker-trigger i{width:6px;height:6px;border-right:1.5px solid #829087;border-bottom:1.5px solid #829087;transform:rotate(45deg);margin-top:-3px}.picker-trigger[aria-expanded=true]{border-color:#93aa9b;background:#f7f9f7}.picker-menu{position:absolute;right:0;top:calc(100% + 7px);min-width:170px;background:white;border:1px solid #e2e9e3;border-radius:12px;padding:5px;box-shadow:0 10px 28px #233b3114;z-index:10}.picker-menu[hidden]{display:none}.picker-menu button{display:block;width:100%;border:0;text-align:left;padding:10px 12px;cursor:pointer;background:transparent;border-radius:7px}.picker-menu button:hover,.picker-menu button:focus-visible{background:#f1f5f0;outline:none}.picker-menu button[aria-selected=true]{background:#edf3eb;color:#536f4e}.picker-trigger:focus-visible{outline:2px solid #93aa9b;outline-offset:2px}</style></head><body><main>
<div class="cards" id="cards"></div>
<div class="grid charts"><section class="card"><h2 class="title">Pass rate × median execution</h2><div class="chart-key" id="model-key"></div><div id="tradeoff"></div></section><section class="card"><div class="chart-heading"><h2 class="title">Execution time</h2><span class="muted">● Median &nbsp; ○ p95 &nbsp; · Scenarios</span></div><div id="latency"></div></section></div>
<section class="card metrics-table"><div class="chart-heading"><h2 class="title">Resources per scenario</h2><span class="muted">Mean</span></div><div class="scroll" id="execution"></div></section>
<section class="card metrics-table"><h2 class="title">Rubric performance</h2><div class="scroll" id="rubric"></div></section>
<section class="card"><div class="filters"><h2 class="title">Scenarios</h2><input id="search" type="search" placeholder="Search" aria-label="Search scenarios"><div class="picker" data-filter="type"><button type="button" class="picker-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="type-options"><span>All types</span><i aria-hidden="true"></i></button><input type="hidden" id="type" value=""><div class="picker-menu" id="type-options" role="listbox" aria-label="All types" hidden><button type="button" role="option" aria-selected="true" data-value="">All types</button><button type="button" role="option" aria-selected="false" data-value="iot">IoT</button><button type="button" role="option" aria-selected="false" data-value="fmsr">FMSR</button><button type="button" role="option" aria-selected="false" data-value="tsfm">TSFM</button><button type="button" role="option" aria-selected="false" data-value="wo">WO</button><button type="button" role="option" aria-selected="false" data-value="multiagent">Multi-agent</button><button type="button" role="option" aria-selected="false" data-value="negative">Negative</button></div></div><div class="picker" data-filter="status"><button type="button" class="picker-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="status-options"><span>All results</span><i aria-hidden="true"></i></button><input type="hidden" id="status" value=""><div class="picker-menu" id="status-options" role="listbox" aria-label="All results" hidden><button type="button" role="option" aria-selected="true" data-value="">All results</button><button type="button" role="option" aria-selected="false" data-value="pass">Pass</button><button type="button" role="option" aria-selected="false" data-value="fail">Fail</button><button type="button" role="option" aria-selected="false" data-value="running">Running</button><button type="button" role="option" aria-selected="false" data-value="grading">Grading</button><button type="button" role="option" aria-selected="false" data-value="pending">Pending</button><button type="button" role="option" aria-selected="false" data-value="failed">Error</button></div></div></div><div id="scenarios"></div></section>
</main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v==null?'—':new Intl.NumberFormat('en',{maximumFractionDigits:1,notation:v>=100000?'compact':'standard'}).format(v),pct=v=>v==null?'—':`${Math.round(v*100)}%`,seconds=v=>v==null?'—':`${num(v/1000)}s`;
let data=null;const opened=new Set();
function table(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function tradeoff(models,colors){
 const w=660,h=270,l=55,r=25,t=12,b=45,iw=w-l-r,ih=h-t-b;
 const max=Math.max(10,...models.map(m=>(m.summary.median_execution_ms??0)/1000))*1.25;
 let marks='';
 for(let i=0;i<=4;i++){const x=l+iw*i/4,y=t+ih-ih*i/4;marks+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="#edf1ed"/><text x="${l-12}" y="${y+4}" text-anchor="end">${i*25}%</text><text x="${x}" y="${h-b+20}" text-anchor="middle">${num(max*i/4)}s</text>`;}
 marks+=models.map((m,i)=>{const s=m.summary;if(s.pass_rate==null||s.median_execution_ms==null)return '';const x=l+iw*(s.median_execution_ms/1000)/max,y=t+ih*(1-s.pass_rate);return `<circle cx="${x}" cy="${y}" r="7" fill="${colors[i%colors.length]}" stroke="white" stroke-width="2"><title>${esc(m.name)}: ${pct(s.pass_rate)}, ${seconds(s.median_execution_ms)}, ${s.graded} graded</title></circle>`}).join('');
 return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Pass rate versus median execution time">${marks}<text x="${l+iw/2}" y="${h-3}" text-anchor="middle">Median execution</text></svg>`;
}
function latency(models,colors){
 const w=660,h=306,l=120,r=65,t=20,b=35,iw=w-l-r;
 const durations=models.flatMap(m=>m.rows.map(r=>r.duration_ms).filter(v=>v!=null&&Number.isFinite(v)));
 const max=Math.max(10000,...durations,...models.map(m=>m.summary.p95_execution_ms??0))*1.08;
 const x=v=>l+iw*v/max;let marks='';
 for(let i=0;i<=4;i++){const xx=l+iw*i/4;marks+=`<line x1="${xx}" x2="${xx}" y1="${t-5}" y2="${h-b}" stroke="#edf1ed"/><text x="${xx}" y="${h-12}" text-anchor="middle">${seconds(max*i/4)}</text>`;}
 models.forEach((m,i)=>{const y=t+20+i*44,s=m.summary,c=colors[i%colors.length],median=s.median_execution_ms,p95=s.p95_execution_ms;marks+=`<text class="label" x="${l-14}" y="${y+4}" text-anchor="end">${esc(m.name)}</text>`;
 m.rows.forEach(row=>{if(row.duration_ms==null)return;marks+=`<circle cx="${x(row.duration_ms)}" cy="${y}" r="2.5" fill="${c}" opacity=".25"><title>${esc(row.id)} · ${seconds(row.duration_ms)}</title></circle>`});
 if(median!=null){marks+=`<line x1="${x(median)}" x2="${x(p95??median)}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="2"/><circle cx="${x(median)}" cy="${y}" r="5" fill="${c}"><title>Median ${seconds(median)}</title></circle>`;if(p95!=null)marks+=`<circle cx="${x(p95)}" cy="${y}" r="4" fill="white" stroke="${c}" stroke-width="2"><title>p95 ${seconds(p95)}</title></circle>`;marks+=`<text x="${w-2}" y="${y+4}" text-anchor="end">${seconds(median)}</text>`;}});
 return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Execution time distribution by model">${marks}</svg>`;
}
function render(){if(!data)return;const models=data.models;
$('scenarios').style.setProperty('--model-count',models.length);
const colors=['#536f4e','#7897ac','#b69b78','#9a88a9','#6fa59d'];
$('cards').innerHTML=models.map((m,i)=>{const s=m.summary,passed=m.rows.filter(r=>r.status==='pass').length,failed=m.rows.filter(r=>r.status==='fail').length,total=m.rows.length;return `<section class="card model"><div class="name"><i class="swatch" style="background:${colors[i%colors.length]}"></i> ${esc(m.name)}</div><div class="card-score"><span class="number">${pct(s.pass_rate)}</span><span class="muted">${s.graded} / ${total} graded</span></div><div class="outcomes" aria-label="${passed} passed, ${failed} failed"><span style="width:${passed/total*100}%;background:#536f4e"></span><span style="width:${failed/total*100}%;background:#c88a75"></span></div><div class="card-counts"><span><b>${passed}</b> Passed</span><span><b>${failed}</b> Failed</span><span><b>${s.completed}</b> Executed</span></div></section>`}).join('');
$('model-key').innerHTML=models.map((m,i)=>`<span><i class="swatch" style="background:${colors[i%colors.length]}"></i>${esc(m.name)}</span>`).join('');
$('tradeoff').innerHTML=tradeoff(models,colors);
$('latency').innerHTML=latency(models,colors);
$('execution').innerHTML=table(['Model','Measured','Tools','Tool errors','Input tokens','Output tokens','Reasoning','Cache read','Cache write','Run errors','Grading · median'],models.map(m=>{const s=m.summary;return [m.name,num(s.execution_time_observed),num(s.tool_call_count?.mean),num(s.tool_errors?.mean),num(s.input_tokens?.mean),num(s.output_tokens?.mean),num(s.reasoning_tokens?.mean),num(s.cache_read_tokens?.mean),num(s.cache_write_tokens?.mean),pct(m.attempt_summary.run_error_rate),seconds(s.median_grading_ms)]}));
const rubrics=[['task_completion','Completion'],['data_retrieval_accuracy','Accuracy'],['generalized_result_verification','Verification'],['agent_sequence_correct','Sequence'],['clarity_and_justification','Clarity'],['hallucinations','No hallucinations']];
$('rubric').innerHTML=`<table class="heat"><thead><tr><th></th>${models.map(m=>`<th>${esc(m.name)}</th>`).join('')}</tr></thead><tbody>${rubrics.map(([k,n])=>`<tr><td>${n}</td>${models.map(m=>{const r=m.summary.rubric_success_rates[k],v=r?.success_rate;return `<td style="background:${v==null?'#f7f9f7':`rgba(83,111,78,${.05+.2*v})`}" title="${esc(m.name)} · ${esc(n)}">${pct(v)}</td>`}).join('')}</tr>`).join('')}</tbody></table>`;

const query=$('search').value.toLowerCase(),type=$('type').value,status=$('status').value;
$('scenarios').innerHTML=`<div class="scenario-columns"><span></span><span></span><div class="model-columns">${models.map(m=>`<span>${esc(m.name)}</span>`).join('')}</div><span></span></div>`+models[0].rows.map((row,i)=>({row,i,results:models.map(m=>({model:m,row:m.rows.find(r=>r.id===row.id)}))})).filter(({row,results})=>(!query||row.question.toLowerCase().includes(query))&&(!type||row.type===type)&&(!status||results.some(r=>r.row.status===status))).map(({row,i,results})=>`<details class="scenario" data-id="${esc(row.id)}" ${opened.has(row.id)?'open':''}><summary><span class="index">${String(i+1).padStart(2,'0')}</span><span class="question">${esc(row.question)}</span><span class="dots">${results.map(r=>`<span class="dot ${r.row.status}" title="${esc(r.model.name)} · ${esc(r.row.status)}"></span>`).join('')}</span><span class="scenario-chevron" aria-hidden="true"></span></summary><div class="detail">${results.map(({model:m,row:r})=>{const metrics=r.metrics||{},score=r.grade?.score;return `<div class="modelresult"><div class="resulthead"><span class="name">${esc(m.name)}</span><span class="pill ${r.status}">${esc(r.status)}${score?.score!=null?` · ${num(score.score)}`:''}</span></div><div class="inline"><span>Execution ${seconds(r.duration_ms)}</span><span>Grading ${seconds(r.grading_ms)}</span><span>Tools ${num(metrics.tool_call_count)}</span><span>Input ${num(metrics.input_tokens)}</span><span>Output ${num(metrics.output_tokens)}</span></div>${r.answer?`<div class="answer">${esc(r.answer)}</div>`:''}${score?.rationale?`<div class="rationale">${esc(score.rationale)}</div>`:''}${r.record?.error?`<div class="rationale">${esc(r.record.error.message)}</div>`:''}${r.record?`<details class="trace"><summary>Metrics & trace</summary><pre>${esc(JSON.stringify({metrics,grading:r.record.grading,settings:r.record.settings,trace_file:r.record.trace_file},null,2))}</pre></details>`:''}</div>`}).join('')}</div></details>`).join('');
$('scenarios').querySelectorAll('.scenario').forEach(el=>el.addEventListener('toggle',()=>el.open?opened.add(el.dataset.id):opened.delete(el.dataset.id)));
}
async function refresh(){try{const response=await fetch('/api/results');if(response.ok){data=await response.json();render()}}catch(e){}finally{setTimeout(refresh,5000)}}
document.querySelectorAll('.picker').forEach(picker=>{
 const trigger=picker.querySelector('.picker-trigger'),menu=picker.querySelector('.picker-menu'),options=[...menu.querySelectorAll('button')],input=picker.querySelector('input');
 const close=()=>{menu.hidden=true;trigger.setAttribute('aria-expanded','false')};
 const open=()=>{document.querySelectorAll('.picker-menu').forEach(m=>m.hidden=true);document.querySelectorAll('.picker-trigger').forEach(t=>t.setAttribute('aria-expanded','false'));menu.hidden=false;trigger.setAttribute('aria-expanded','true');(options.find(o=>o.getAttribute('aria-selected')==='true')||options[0]).focus()};
 trigger.addEventListener('click',()=>menu.hidden?open():close());
 trigger.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();open()}});
 options.forEach((option,i)=>{option.addEventListener('click',()=>{input.value=option.dataset.value;trigger.querySelector('span').textContent=option.textContent;options.forEach(o=>o.setAttribute('aria-selected',String(o===option)));close();trigger.focus();render()});option.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close();trigger.focus()}else if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();options[e.key==='Home'?0:e.key==='End'?options.length-1:(i+(e.key==='ArrowDown'?1:-1)+options.length)%options.length].focus()}else if(e.key==='Tab')close()})});
 document.addEventListener('click',e=>{if(!picker.contains(e.target))close()});
});
['search','type','status'].forEach(id=>$(id).addEventListener('input',render));refresh();
</script></body></html>
