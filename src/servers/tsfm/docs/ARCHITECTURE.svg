<svg viewBox="0 0 1280 950" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial">
<title id="ttl">TSFM MCP Server architecture</title>
<desc id="dsc">Inputs as file pointers feed a TSFM MCP server built on sktime: evidence and discovery tools, model and feature stores, a recipe engine that composes the pipeline, GIFT-Eval scoring, eight result tables, and a downstream handoff to FMSR, WO and Spot.</desc>
<style>
  .box{fill:#f6f5f2;stroke:#d8d4cd;stroke-width:1.2;}
  .core{fill:#eaf0f5;stroke:#b6c4d2;stroke-width:1.3;}
  .dash{fill:none;stroke:#c9c5bd;stroke-width:1.3;stroke-dasharray:5 4;}
  .dashbox{fill:#fbfaf8;stroke:#cfcbc3;stroke-width:1.2;stroke-dasharray:5 4;}
  .srv{fill:none;stroke:#211f1c;stroke-width:1.6;}
  .lbl{fill:#6f6b65;font-size:11.5px;font-weight:700;letter-spacing:.07em;}
  .t{fill:#2a2723;font-size:15px;font-weight:700;}
  .tm{fill:#2a2723;font-size:13.5px;font-weight:700;}
  .s{fill:#6f6b65;font-size:11.5px;}
  .mut{fill:#8a857e;font-size:11px;}
  .ln{stroke:#9a958d;stroke-width:1.4;fill:none;}
</style>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#9a958d"/></marker>
  <marker id="arru" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#c9c5bd"/></marker>
</defs>

<text class="lbl" x="40" y="40">INPUTS · FILE POINTERS → COUCHDB</text>
<rect class="box" x="40" y="52" width="220" height="54" rx="9"/>
<text class="tm" x="150" y="76" text-anchor="middle">iot</text>
<text class="s" x="150" y="93" text-anchor="middle">asset_id · timestamp · channels</text>
<rect class="box" x="280" y="52" width="220" height="54" rx="9"/>
<text class="tm" x="390" y="76" text-anchor="middle">vibration</text>
<text class="s" x="390" y="93" text-anchor="middle">high-rate channels</text>
<rect class="box" x="520" y="52" width="250" height="54" rx="9"/>
<text class="tm" x="645" y="76" text-anchor="middle">dataset_path</text>
<text class="s" x="645" y="93" text-anchor="middle">CMAPSS · CWRU · GIFT-Eval</text>
<path class="ln" d="M300,106 L300,148" marker-end="url(#arr)"/>

<rect class="srv" x="28" y="150" width="1224" height="676" rx="14"/>
<text class="t" x="48" y="180">TSFM MCP SERVER<tspan class="s" dx="10"> — 16 tools · sktime substrate · the agent composes recipes</tspan></text>

<text class="lbl" x="48" y="208">EVIDENCE &amp; DISCOVERY · agent reads the menu, then decides</text>
<rect class="box" x="48" y="216" width="282" height="46" rx="8"/>
<text class="tm" x="189" y="238" text-anchor="middle">profile_series</text>
<text class="s" x="189" y="254" text-anchor="middle">facts only · no decisions</text>
<rect class="box" x="346" y="216" width="282" height="46" rx="8"/>
<text class="tm" x="487" y="238" text-anchor="middle">list_tasks</text>
<text class="s" x="487" y="254" text-anchor="middle">8 task contracts</text>
<rect class="box" x="644" y="216" width="282" height="46" rx="8"/>
<text class="tm" x="785" y="238" text-anchor="middle">discover_components</text>
<text class="s" x="785" y="254" text-anchor="middle">menu + training regime</text>
<rect class="box" x="942" y="216" width="262" height="46" rx="8"/>
<text class="tm" x="1073" y="238" text-anchor="middle">find_models · find_features</text>
<text class="s" x="1073" y="254" text-anchor="middle">rank candidates (HuggingGPT)</text>

<text class="lbl" x="48" y="290">REGISTRIES · catalog = pointer index (state-exportable, #394)</text>
<rect class="box" x="48" y="298" width="560" height="70" rx="9"/>
<text class="t" x="68" y="328">Model Store</text>
<text class="s" x="68" y="349">cards · zero-shot / fit / fine-tune · local · hf · api-async</text>
<rect class="box" x="624" y="298" width="580" height="70" rx="9"/>
<text class="t" x="644" y="328">Feature Store</text>
<text class="s" x="644" y="349">FLOps select (multi-config) · EFE evolve · fit / transform / inverse</text>
<path class="ln" d="M328,368 L328,398" marker-end="url(#arr)"/>

<text class="lbl" x="48" y="394">RECIPE ENGINE · the pipeline is composed, not fixed</text>
<rect class="core" x="48" y="402" width="380" height="70" rx="9"/>
<text class="t" x="238" y="432" text-anchor="middle">run_recipe</text>
<text class="s" x="238" y="453" text-anchor="middle">transforms + single / ensemble + conformal</text>
<rect class="core" x="444" y="402" width="384" height="70" rx="9"/>
<text class="t" x="636" y="432" text-anchor="middle">run_tabular_recipe</text>
<text class="s" x="636" y="453" text-anchor="middle">FeatureUnion → estimator</text>
<rect class="core" x="844" y="402" width="360" height="70" rx="9"/>
<text class="t" x="1024" y="432" text-anchor="middle">run_plan</text>
<text class="s" x="1024" y="453" text-anchor="middle">DAG · file-pointer chaining</text>
<text class="mut" x="48" y="490">sktime compiles &amp; runs each recipe · agent mixes, scores, iterates · zero-shot skips the retrain loop</text>
<path class="ln" d="M626,472 L626,502" marker-end="url(#arr)"/>

<rect class="core" x="48" y="502" width="1156" height="48" rx="9"/>
<text class="t" x="68" y="525">evaluate · GIFT-Eval</text>
<text class="s" x="290" y="525">seasonal-naive-normalized MASE + CRPS · geometric mean · mean-rank leaderboard</text>
<path class="ln" d="M626,550 L626,578" marker-end="url(#arr)"/>

<text class="lbl" x="48" y="574">RESULT TABLES · write_result(task)</text>
<rect class="box" x="48" y="580" width="1156" height="70" rx="9"/>
<text class="tm" x="626" y="610" text-anchor="middle">forecasting · regression · classification · anomaly · imputation · clustering · similarity · evaluation</text>
<text class="s" x="626" y="632" text-anchor="middle">pointer (results CSV) + summary + provenance (model · features · dataset) + param_audit + training_regime</text>

<rect class="dashbox" x="48" y="664" width="1156" height="42" rx="9"/>
<text class="s" x="626" y="690" text-anchor="middle">register_model · register_feature · finetune → checkpoint @path  ·  agent-decided · weights live where saved</text>
<path class="dash" d="M1224,664 C1248,620 1248,420 1224,372" marker-end="url(#arru)"/>
<text class="mut" x="1196" y="520" text-anchor="end">writes back to catalog</text>
<text class="s" x="48" y="730"><tspan class="tm">Reasoning split — </tspan>server gives evidence + grades; the agent decides the recipe and every parameter.</text>
<text class="s" x="48" y="752">anomaly_result / forecast_result → handoff to downstream  ·  no alerts inside TSFM  ·  export_state()</text>
<path class="ln" d="M150,752 L150,872" marker-end="url(#arr)"/>

<text class="lbl" x="40" y="858">DOWNSTREAM · other MCP servers (consumers)</text>
<rect class="dashbox" x="40" y="866" width="220" height="52" rx="9"/>
<text class="tm" x="150" y="889" text-anchor="middle">FMSR</text>
<text class="s" x="150" y="906" text-anchor="middle">anomaly → failure code</text>
<rect class="dashbox" x="280" y="866" width="220" height="52" rx="9"/>
<text class="tm" x="390" y="889" text-anchor="middle">WO</text>
<text class="s" x="390" y="906" text-anchor="middle">SR · work order</text>
<rect class="dashbox" x="520" y="866" width="220" height="52" rx="9"/>
<text class="tm" x="630" y="889" text-anchor="middle">Spot</text>
<text class="s" x="630" y="906" text-anchor="middle">verify · confirm / false</text>
<path class="ln" d="M260,892 L278,892" marker-end="url(#arr)"/>
<path class="ln" d="M500,892 L518,892" marker-end="url(#arr)"/>

<rect class="box" x="812" y="862" width="428" height="60" rx="9"/>
<rect class="core" x="828" y="876" width="20" height="12" rx="3"/>
<text class="s" x="856" y="886">TSFM-owned · all in CouchDB</text>
<rect class="dashbox" x="828" y="898" width="20" height="12" rx="3"/>
<text class="s" x="856" y="908">downstream consumer (read-only)</text>
<text class="mut" x="1224" y="886" text-anchor="end">accent = the run path</text>
<text class="mut" x="1224" y="908" text-anchor="end">zero-shot default · fine-tune optional</text>
</svg>
