# tsfm hard-15: the 15 hardest of the 30 time-series scenarios.
#
# Selected on measured model performance, re-scored with the current scorer
# (sidecar tolerances applied), over 10 to 21 trials per scenario across 15
# model/run combinations in leaderboard_result*.
#
# Rank = mean of the rank by mean f1 and the rank by pass rate, so a scenario
# qualifies either by low graded score or by low pass rate, not by one alone.
#
#   this set        mean f1 0.535   mean pass rate 0.163
#   all 30          mean f1 0.595   mean pass rate 0.247
#
# Every gold key in these 15 is satisfied by at least one trial, so each is
# hard but demonstrably answerable. Seven scenarios were held out instead of
# selected despite scoring lower, because a key in them is never satisfied by
# any model, which is the signature of a defective gold rather than difficulty:
#
#   1019  start_point 0/21   gold onset 08:20:00, eight runs agree on 07:11:00
#   1020  all 4 keys 0/10    healthy control carries a single-sample dropout
#                            at 00:07:09; also uses `label`, not `detected_label`
#   1029  failure_count 0/10 premise defect
#   1016  failure_code 0/10  gold FC108, eight models answer FC109
#   1018  failure_code 0/11  gold FC108, eight models answer FC103
#   1023  failure_code 0/9   gold FC112, five models answer FC110
#   1017  failure_code 1/12  gold FC108, answers split FC109 / FC103
#
# FC109 is identified 21/21 while FC108 is never identified, so the FC108
# injections are very likely mislabelled or indistinguishable from FC109.
# Verify the injection script before any of these four counts as hard.
#
# Composition: bearing 5, gear 3, motor 3, MetroPT 2, FC101-103 block 2, and
# two healthy controls (1007, 1024) so a model that always reports a fault
# cannot score well.

