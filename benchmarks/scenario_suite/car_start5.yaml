# CAR starter-5: the first five CAR scenarios to benchmark.
#
# Chosen to make the mode decision informative rather than to minimise score.
# CAR's pass criterion is the response/clarification/abstain choice plus the
# required concepts, so a set drawn from one mode would be passed by a constant
# answer. The gold modes here are 2 abstain, 2 clarification, 1 response, which
# caps every constant strategy at 2/5:
#
#   always abstain        2/5
#   always clarification  2/5
#   always response       1/5
#
# Difficulty is spread using the measured mode accuracy of the ten models whose
# CAR trials are in leaderboard_result and leaderboard_result_oct01:
#
#   166  abstain        10/10  ceiling anchor: a failure here is a harness fault,
#                              not a model result
#   191  abstain         6/9   the scenario that exposed the paraphrase bug. Five
#                              models correctly abstained and all five were failed
#                              on the literal phrase "save the most". It is the
#                              end-to-end check that the any_of fix works on real
#                              answers
#   159  clarification   6/10  mid-difficulty clarification
#   158  clarification   3/9   hardest exercised clarification; five of nine models
#                              answer instead of asking
#   179  response         new  the only mode with no trial history. Its gold is a
#                              flat "No - PMP42144 is not a pump", so it tests
#                              whether a model will commit to a direct answer, and
#                              it validates a hand-written sidecar
#
# Expected pass rate from history is roughly 0.6, so the set is neither floored
# nor saturated.
#
# Held back deliberately: 152 and 157, both 0/10 on mode. On 152 nine of ten
# models answer `response` against an `abstain` gold; on 157 six answer
# `clarification` and four `response`, none abstain. Each question carries two
# defensible readings, so these are golds to adjudicate before they are scored,
# not scenarios to benchmark on. They are the CAR analogue of the FC108 problem
# in the time-series block.

car:
- 158
- 159
- 166
- 179
- 191
