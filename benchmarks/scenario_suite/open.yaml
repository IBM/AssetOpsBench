# The "open" profile: scenarios whose data ships in this repository.
#
# `lite` and `all` reference the full benchmark corpus, which is distributed
# separately -- running them against a fresh clone fails on the first scenario
# with "Missing question file for scenario 151". This profile lists only the
# scenario_<id>/ folders present under src/couchdb/scenarios_data/, so it runs
# end to end with nothing extra downloaded.
#
# Use it to prove the pipeline works -- credentials, CouchDB, the Docker
# sandbox, trajectory capture, scoring -- before chasing the full corpus. It is
# a smoke test, not a benchmark result: two work-order scenarios are not a
# basis for comparing models.
#
# Every category key must be present even when empty; the profile as a whole
# needs at least one id.
#
# Add ids here as you materialise more scenario folders.

car: []
fcc: []
fmsr: []
health: []
tsfm: []
wosr:
  - 1
  - 2
  - 3