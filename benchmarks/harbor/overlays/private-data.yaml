# Opt-in overlay that mounts a private scenario suite into `main`, read-only.
#
#   export AOB_PRIVATE_DIR=<path-to>/AssetOpsBenchScenarioGeneration/scenarios_data
#   harbor run -p benchmarks/harbor/datasets/assetopsbench-mini \
#     --extra-docker-compose benchmarks/harbor/overlays/private-data.yaml ...
#
# Generate the tasks with --scenario-root "$AOB_PRIVATE_DIR". Any root other than
# the repo's own makes the healthcheck run init_data.py with SCENARIOS_DATA_DIR
# pointing at this mount, so each manifest's shared/... paths resolve against the
# suite's own shared/ directory. The agent keeps the repo copy, as it does with
# the suite image.
#
# The alternative to suite-image/Dockerfile, which bakes the same directory into
# an image at the same path. The mount needs no rebuild when the suite changes,
# so it suits iterating on scenario data. The image is the one to report from:
# it pins the data a run used, and it works on Harbor providers that cannot see
# the host's filesystem, which a bind mount cannot.
#
# Only init_data.py reads the mount, and only the files a manifest names, so
# going through Docker Desktop or Rancher file sharing costs little: the all
# profile references 58 MB of the suite's 2.1 GB shared/ directory.
#
# Two subdirectories, not the suite root. The data load needs only shared/ (the
# paths every manifest names) and default/manifest.json; each task's own
# scenario_<id>/ arrives through the task Dockerfile. Mounting the root instead
# would put every OTHER scenario's groundtruth.txt inside the agent container,
# where an agent can read the answer and score without touching CouchDB.
# Mounting subdirectories also leaves the Dockerfile's scenario_<id>/ in place
# rather than shadowing it.
#
# `:?` names the missing variable when AOB_PRIVATE_DIR is unset. A plain
# ${AOB_PRIVATE_DIR} fails too, but as "invalid spec: :/opt/suite/...: empty
# section between colons", which does not say what to set.
services:
  main:
    volumes:
      - ${AOB_PRIVATE_DIR:?set AOB_PRIVATE_DIR to the private suite's scenarios_data directory}/shared:/opt/suite/scenarios_data/shared:ro
      - ${AOB_PRIVATE_DIR:?set AOB_PRIVATE_DIR to the private suite's scenarios_data directory}/default:/opt/suite/scenarios_data/default:ro
